<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Administrador - Cúcuta Movilidad Inteligente</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    margin-bottom:10px;
    color:#2c3e50;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

.btn-success{
    background:#2ecc71;
    color:white;
}

.btn-danger{
    background:#e74c3c;
    color:white;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#2c3e50;
    color:white;
}

th,td{
    padding:10px;
    border:1px solid #ddd;
    text-align:left;
}

#mapa{
    height:300px;
    border-radius:8px;
}

.badge{
    background:gold;
    padding:3px 8px;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Panel de Administración</h1>

<div class="card">
<h2>Agregar Negocio</h2>

<form id="form-negocio">

<div class="form-group">
<label>Nombre</label>
<input type="text" id="neg-nombre" required>
</div>

<div class="form-group">
<label>Categoría</label>
<select id="neg-categoria">
<option value="Taller de Ciclismo">Taller de Ciclismo</option>
<option value="Tienda de Bicicletas">Tienda de Bicicletas</option>
<option value="Cafetería">Cafetería</option>
<option value="Parqueadero">Parqueadero</option>
<option value="Otro">Otro</option>
</select>
</div>

<div class="form-group">
<label>Latitud</label>
<input type="number" step="any" id="neg-lat" required>
</div>

<div class="form-group">
<label>Longitud</label>
<input type="number" step="any" id="neg-lng" required>
</div>

<div class="form-group">
<label>Ubicación</label>
<div id="mapa"></div>
</div>

<button type="submit" class="btn-success">
Registrar Negocio
</button>

</form>
</div>

<div class="card">
<h2>Negocios Registrados</h2>

<table>
<thead>
<tr>
<th>Nombre</th>
<th>Categoría</th>
<th>Coordenadas</th>
<th>Premium</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tabla-negocios"></tbody>

</table>
</div>

<div class="card">
<h2>Reportes de Usuarios</h2>

<table>
<thead>
<tr>
<th>Descripción</th>
<th>Ubicación</th>
<th>Acción</th>
</tr>
</thead>

<tbody id="tabla-reportes"></tbody>

</table>
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const URL_SCRIPT_GOOGLE =
"https://script.google.com/macros/s/AKfycbzv3SfQWzhVkiZVsogMd_8FjADxA9J5jzh-mqM05Z3uF4wB9jTTICFX_BV7FYEu-L5R/exec";


// MAPA

const mapa = L.map('mapa').setView([7.8939,-72.5078],13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(mapa);

let marcador;

mapa.on('click', e => {

const lat = e.latlng.lat;
const lng = e.latlng.lng;

document.getElementById('neg-lat').value = lat.toFixed(6);
document.getElementById('neg-lng').value = lng.toFixed(6);

if(marcador){
mapa.removeLayer(marcador);
}

marcador = L.marker([lat,lng]).addTo(mapa);

});


// AGREGAR NEGOCIO

document.getElementById('form-negocio')
.addEventListener('submit', async function(e){

e.preventDefault();

const datos = {

accion:"agregarNegocio",

nombre:
document.getElementById('neg-nombre').value,

tipo:
document.getElementById('neg-categoria').value,

telefono:"",

lat:
parseFloat(document.getElementById('neg-lat').value),

lng:
parseFloat(document.getElementById('neg-lng').value)

};

try{

await fetch(URL_SCRIPT_GOOGLE,{
method:"POST",
mode:"no-cors",
body:JSON.stringify(datos)
});

alert("Negocio agregado");

this.reset();

cargarNegocios();

}catch(error){

console.error(error);

alert("Error al guardar");

}

});


// CARGAR NEGOCIOS

async function cargarNegocios(){

try{

const res =
await fetch(URL_SCRIPT_GOOGLE + "?accion=negocios");

const negocios =
await res.json();

const tabla =
document.getElementById('tabla-negocios');

tabla.innerHTML = "";

negocios.forEach((neg,index)=>{

const premium =
neg.destacado==="VERDADERO";

tabla.innerHTML += `
<tr>

<td>${neg.nombre}</td>

<td>${neg.tipo}</td>

<td>${neg.lat}, ${neg.lng}</td>

<td>
${premium ? '<span class="badge">PREMIUM</span>' : ''}
</td>

<td>

<button
class="btn-danger"
onclick="eliminarNegocio('${neg.nombre}')">
Eliminar
</button>

</td>

</tr>
`;

});

}catch(error){

console.error(error);

}

}


// ELIMINAR NEGOCIO

async function eliminarNegocio(nombre){

if(!confirm("¿Eliminar negocio?")){
return;
}

await fetch(URL_SCRIPT_GOOGLE,{
method:"POST",
mode:"no-cors",
body:JSON.stringify({
accion:"eliminarNegocio",
nombre:nombre
})
});

cargarNegocios();

}


// CARGAR REPORTES

async function cargarReportes(){

try{

const res =
await fetch(URL_SCRIPT_GOOGLE);

const reportes =
await res.json();

const tabla =
document.getElementById('tabla-reportes');

tabla.innerHTML = "";

reportes.forEach((rep,index)=>{

tabla.innerHTML += `
<tr>

<td>${rep.descripcion}</td>

<td>${rep.lat}, ${rep.lng}</td>

<td>

<button
class="btn-danger"
onclick="eliminarReporte(
'${rep.descripcion.replace(/'/g,"\\'")}',
${rep.lat},
${rep.lng}
)">
Eliminar
</button>

</td>

</tr>
`;

});

}catch(error){

console.error(error);

}

}


// ELIMINAR REPORTE

async function eliminarReporte(descripcion,lat,lng){

if(!confirm("¿Eliminar reporte?")){
return;
}

await fetch(URL_SCRIPT_GOOGLE,{
method:"POST",
mode:"no-cors",
body:JSON.stringify({

accion:"eliminarReporte",
descripcion:descripcion,
lat:lat,
lng:lng

})
});

cargarReportes();

}


// INICIO

window.onload = () => {

cargarNegocios();
cargarReportes();

setTimeout(()=>{
mapa.invalidateSize();
},500);

};

</script>

</body>
</html>
