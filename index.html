<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movilidad Cúcuta</title>

<link
 rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

#map{
    height:50vh;
    width:100%;
}

.panel{
    padding:15px;
}

input, select, textarea{
    width:100%;
    margin-bottom:10px;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-bottom:10px;
    border:none;
    border-radius:12px;
    background:#38bdf8;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.estado{
    margin-top:10px;
    font-weight:bold;
}

</style>
</head>

<body>

<div id="map"></div>

<div class="panel">

<select id="tipo">
    <option value="Inseguridad">Inseguridad</option>
    <option value="Hueco">Hueco</option>
    <option value="Accidente">Accidente</option>
    <option value="Tráfico">Tráfico</option>
</select>

<textarea id="descripcion" placeholder="Describe el problema"></textarea>

<button onclick="reportar()">
📍 Reportar
</button>

<button onclick="seguirUbicacion()">
🧭 Seguir mi ubicación
</button>

<button onclick="cargarReportes()">
🚴 Mostrar Reportes
</button>

<div class="estado" id="estado"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzTxFSbaH3xR3Qr7GsNhn1hENm0TufCklEJpp5lf9HTvCBNqlkLoAXcw0_nEGCFQJ76/exec";

/* =========================
   MAPA
========================= */

const map = L.map('map').setView([7.8891, -72.4967], 13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
).addTo(map);

let marcadorUsuario = null;

/* =========================
   SEGUIR UBICACIÓN
========================= */

function seguirUbicacion(){

    navigator.geolocation.watchPosition(pos => {

        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        if(marcadorUsuario){
            map.removeLayer(marcadorUsuario);
        }

        marcadorUsuario = L.marker([lat,lng])
        .addTo(map)
        .bindPopup("Tu ubicación");

        map.setView([lat,lng],15);

    });

}

/* =========================
   REPORTAR
========================= */

async function reportar(){

    const estado = document.getElementById("estado");

    estado.innerHTML = "⏳ Enviando reporte...";

    navigator.geolocation.getCurrentPosition(async pos => {

        const data = {
            tipo: document.getElementById("tipo").value,
            descripcion: document.getElementById("descripcion").value,
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
        };

        try{

            await fetch(API_URL,{
                method:"POST",
                body:JSON.stringify(data)
            });

            estado.innerHTML =
            "✅ Reporte enviado correctamente";

            cargarReportes();

        }catch(err){

            estado.innerHTML =
            "❌ Error enviando reporte";

            console.log(err);

        }

    });

}

/* =========================
   CARGAR REPORTES
========================= */

async function cargarReportes(){

    const estado = document.getElementById("estado");

    estado.innerHTML = "⏳ Cargando reportes...";

    try{

        const res = await fetch(API_URL);

        const datos = await res.json();

        datos.forEach(r => {

            if(!r.lat || !r.lng) return;

            L.marker([
                Number(r.lat),
                Number(r.lng)
            ])
            .addTo(map)
            .bindPopup(`
                <b>${r.tipo}</b><br>
                ${r.descripcion}
            `);

        });

        estado.innerHTML =
        "✅ Reportes cargados";

    }catch(err){

        estado.innerHTML =
        "❌ Error cargando reportes";

        console.log(err);

    }

}

</script>

</body>
</html>
