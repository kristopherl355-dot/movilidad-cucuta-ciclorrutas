<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movilidad Cúcuta</title><link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/><style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#f5f5f5;
}

#map {
  height:60vh;
  width:100%;
}

.panel {
  padding:12px;
  background:white;
}

button {
  width:100%;
  padding:12px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  background:#3498db;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:disabled {
  opacity:0.6;
}

.loader {
  display:none;
  width:24px;
  height:24px;
  border:4px solid #ccc;
  border-top:4px solid #3498db;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:10px auto;
}

@keyframes spin {
  100% {
    transform:rotate(360deg);
  }
}

h3 {
  margin-top:15px;
}
</style></head><body><div id="map"></div><div class="panel"><button id="btnReportar" onclick="reportar()">
📍 Reportar
</button><div id="loader" class="loader"></div><h3>Filtros</h3><label><input type="checkbox" value="accidente" checked> Accidentes</label><br>
<label><input type="checkbox" value="hueco" checked> Huecos</label><br>
<label><input type="checkbox" value="trafico" checked> Tráfico</label><br>
<label><input type="checkbox" value="cierre_via" checked> Cierre vía</label><br>
<label><input type="checkbox" value="inseguridad" checked> Inseguridad</label><br>

<button onclick="toggleRutas()">🚲 Mostrar Ciclorutas</button>

</div><script src="https://unpkg.com/leaflet/dist/leaflet.js"></script><script>

// 🔗 URL APPS SCRIPT
const API_URL = "PEGA_AQUI_TU_URL";

// 🗺️ MAPA
const map = L.map('map').setView([7.8891, -72.4967], 13);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution:'© OpenStreetMap'
  }
).addTo(map);

// 📍 UBICACIÓN USUARIO
let userMarker;
let ultimaPosicion = null;

navigator.geolocation.watchPosition(pos => {

  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;

  if (
    !ultimaPosicion ||
    Math.abs(lat - ultimaPosicion.lat) > 0.0005 ||
    Math.abs(lng - ultimaPosicion.lng) > 0.0005
  ) {

    ultimaPosicion = { lat, lng };

    if (!userMarker) {
      userMarker = L.marker([lat, lng]).addTo(map);
    } else {
      userMarker.setLatLng([lat, lng]);
    }

    cargarReportes();
  }

});

// 🔊 VOZ
function hablar(texto){

  if(speechSynthesis.speaking) return;

  const msg = new SpeechSynthesisUtterance(texto);
  msg.lang = "es-ES";

  speechSynthesis.speak(msg);
}

// 📏 DISTANCIA
function calcularDistancia(lat1, lng1, lat2, lng2){

  const R = 6371;

  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLng/2)**2;

  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

// 🔊 CONTROL VOZ
let reportesAvisados = new Set();

// 🎛️ FILTROS
let filtrosActivos = new Set([
  "accidente",
  "hueco",
  "trafico",
  "cierre_via",
  "inseguridad"
]);

document.querySelectorAll('input[type=checkbox]').forEach(cb => {

  cb.addEventListener("change", () => {

    if(cb.checked){
      filtrosActivos.add(cb.value);
    } else {
      filtrosActivos.delete(cb.value);
    }

    cargarReportes();
  });

});

// 🧱 CAPAS
const capaReportes = L.layerGroup().addTo(map);
const capaRutas = L.layerGroup().addTo(map);

// 🔄 CARGAR REPORTES
async function cargarReportes(){

  capaReportes.clearLayers();

  try {

    const res = await fetch(API_URL, {
      cache:"no-store"
    });

    const data = await res.json();

    const LIMITE = 50;

    data.slice(-LIMITE).forEach(r => {

      if(!filtrosActivos.has(r.tipo)) return;

      let color = "red";

      if(r.tipo === "hueco") color = "orange";
      if(r.tipo === "trafico") color = "yellow";
      if(r.tipo === "cierre_via") color = "black";
      if(r.tipo === "inseguridad") color = "purple";

      L.circleMarker([r.lat, r.lng], {
        radius:8,
        color:color,
        fillColor:color,
        fillOpacity:0.9
      })
      .addTo(capaReportes)

      // 📋 POPUP COMPLETO
      .bindPopup(`
        <b>Tipo:</b> ${r.tipo}<br>
        <b>Descripción:</b> ${r.descripcion}<br>
        <b>Hora:</b> ${new Date(r.fecha).toLocaleTimeString()}<br>
        <b>Fecha:</b> ${new Date(r.fecha).toLocaleDateString()}
      `);

      // 🔊 ALERTA POR VOZ
      if(userMarker){

        const userPos = userMarker.getLatLng();

        const distancia = calcularDistancia(
          userPos.lat,
          userPos.lng,
          r.lat,
          r.lng
        );

        if(distancia < 0.3){

          const id = r.lat + "_" + r.lng;

          if(!reportesAvisados.has(id)){

            reportesAvisados.add(id);

            hablar(Atención, ${r.tipo} cerca);

          }
        }
      }

    });

  } catch(error){

    console.log(error);

  }

}

// ⏱️ ACTUALIZAR MÁS LENTO
setInterval(cargarReportes, 20000);

cargarReportes();

// 🔄 LOADER
function mostrarLoader(v){

  document.getElementById("loader").style.display =
    v ? "block" : "none";

  document.getElementById("btnReportar").disabled = v;
}

// 📤 REPORTAR
async function reportar(){

  const nombre = prompt("Tu nombre:");
  const descripcion = prompt("Describe lo que ocurre:");

  if(!nombre || !descripcion) return;

  mostrarLoader(true);

  navigator.geolocation.getCurrentPosition(async pos => {

    try {

      const data = {
        nombre,
        descripcion,
        lat: pos.coords.latitude,
        lng: pos.coords.longitude
      };

      const res = await fetch(API_URL, {
        method:"POST",
        body: JSON.stringify(data)
      });

      const json = await res.json();

      alert(json.mensaje || "Enviado");

    } catch(error){

      alert("Error al enviar.");

    }

    mostrarLoader(false);

  });

}

// 🚲 CICLORUTAS
async function toggleRutas(){

  capaRutas.clearLayers();

  const res = await fetch("ciclorutas.json");

  const rutas = await res.json();

  rutas.forEach(r => {

    L.polyline(r.coords, {
      color:"blue"
    }).addTo(capaRutas);

  });

}

// 📦 SERVICE WORKER
if('serviceWorker' in navigator){

  navigator.serviceWorker.register('sw.js');

}

</script></body>
</html>
