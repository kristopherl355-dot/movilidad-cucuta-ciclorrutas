<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Movilidad Cúcuta</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

header{
    background:#111827;
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#38bdf8;
}

#map{
    height:55vh;
    width:100%;
}

.panel{
    padding:15px;
    background:#1e293b;
}

button{
    width:100%;
    padding:16px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    background:#38bdf8;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0ea5e9;
}

select, textarea{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

textarea{
    resize:none;
    height:90px;
}

#estado{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.loader{
    width:45px;
    height:45px;
    border:5px solid rgba(255,255,255,0.2);
    border-top:5px solid #38bdf8;
    border-radius:50%;
    animation:giro 1s linear infinite;
    margin:15px auto;
    display:none;
}

@keyframes giro{
    100%{
        transform:rotate(360deg);
    }
}

</style>
</head>

<body>

<header>
🚴 Movilidad Cúcuta
</header>

<div id="map"></div>

<div class="panel">

<select id="tipo">
    <option value="">Selecciona un problema</option>
    <option value="Hueco">🕳️ Hueco</option>
    <option value="Accidente">🚨 Accidente</option>
    <option value="Inseguridad">⚠️ Inseguridad</option>
    <option value="Tráfico">🚗 Tráfico</option>
</select>

<textarea
id="descripcion"
placeholder="Describe el problema..."
></textarea>

<button onclick="reportar()">
📍 Reportar
</button>

<button onclick="seguirUbicacion()">
🧭 Seguir mi ubicación
</button>

<button onclick="mostrarCiclorutas()">
🚴 Mostrar Ciclorutas
</button>

<div class="loader" id="loader"></div>

<div id="estado"></div>

</div>

<script>

/* ========= URL APPS SCRIPT ========= */

const API_URL =
"https://script.google.com/macros/s/AKfycbwCnN_hupwzmSHHjQMVtdW2n_1td5VaLnCFeuoxSkA32YIyq6WA9uSSR8n6soB9hRV8/exec";

/* ========= MAPA ========= */

let map = L.map("map").setView([7.8891, -72.4967], 13);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
    attribution:"© OpenStreetMap"
}).addTo(map);

/* ========= VARIABLES ========= */

let marcadores = [];
let marcadorUsuario = null;
let siguiendo = false;

/* ========= ICONOS ========= */

const iconoReporte = L.icon({
    iconUrl:"https://cdn-icons-png.flaticon.com/512/684/684908.png",
    iconSize:[35,35]
});

const iconoUsuario = L.icon({
    iconUrl:"https://cdn-icons-png.flaticon.com/512/149/149060.png",
    iconSize:[35,35]
});

/* ========= CARGAR REPORTES ========= */

async function cargarReportes(){

    try{

        const res = await fetch(API_URL);
        const datos = await res.json();

        marcadores.forEach(m => map.removeLayer(m));
        marcadores = [];

        datos.forEach(rep => {

            if(!rep.lat || !rep.lng) return;

            const marcador = L.marker(
                [rep.lat, rep.lng],
                {icon:iconoReporte}
            ).addTo(map);

            marcador.bindPopup(`
                <b>${rep.tipo}</b><br>
                ${rep.descripcion}<br>
                <small>${rep.fecha}</small>
            `);

            marcadores.push(marcador);

        });

    }catch(error){

        document.getElementById("estado").innerHTML =
        "❌ Error cargando reportes";

        console.error(error);
    }
}

/* ========= REPORTAR ========= */

function reportar(){

    const tipo =
    document.getElementById("tipo").value;

    const descripcion =
    document.getElementById("descripcion").value;

    if(!tipo || !descripcion){

        alert("Completa todos los campos");
        return;
    }

    document.getElementById("loader").style.display =
    "block";

    navigator.geolocation.getCurrentPosition(async pos => {

        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        const datos = {
            tipo,
            descripcion,
            lat,
            lng
        };

        try{

            await fetch(API_URL,{
                method:"POST",
                body:JSON.stringify(datos)
            });

            document.getElementById("estado").innerHTML =
            "✅ Reporte enviado correctamente";

            document.getElementById("tipo").value = "";
            document.getElementById("descripcion").value = "";

            cargarReportes();

        }catch(error){

            document.getElementById("estado").innerHTML =
            "❌ Error enviando reporte";

            console.error(error);
        }

        document.getElementById("loader").style.display =
        "none";

    });

}

/* ========= UBICACIÓN ========= */

function seguirUbicacion(){

    siguiendo = !siguiendo;

    if(siguiendo){

        navigator.geolocation.watchPosition(pos => {

            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            if(marcadorUsuario){

                marcadorUsuario.setLatLng([lat,lng]);

            }else{

                marcadorUsuario = L.marker(
                    [lat,lng],
                    {icon:iconoUsuario}
                ).addTo(map);

                marcadorUsuario.bindPopup(
                    "Tu ubicación"
                );
            }

            map.setView([lat,lng],16);

        });

        document.getElementById("estado").innerHTML =
        "🟢 Seguimiento activado";

    }else{

        document.getElementById("estado").innerHTML =
        "🔴 Seguimiento desactivado";
    }
}

/* ========= CICLORUTAS ========= */

function mostrarCiclorutas(){

    const ruta = [
        [7.893,-72.498],
        [7.900,-72.490],
        [7.907,-72.482]
    ];

    L.polyline(ruta,{
        color:"#00ff99",
        weight:6
    }).addTo(map);

    document.getElementById("estado").innerHTML =
    "🚴 Ciclorutas mostradas";
}

/* ========= INICIO ========= */

cargarReportes();

setInterval(cargarReportes, 10000);

</script>

</body>
</html>
