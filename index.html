<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Mobility Cúcuta</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007bff">

<style>
body { margin:0; font-family: Arial; }
#map { height:60vh; }
#panel { height:40vh; padding:10px; background:#f5f5f5; }

button { width:100%; padding:12px; margin-top:6px; }
input, select, textarea { width:100%; margin-top:5px; }

/* Loader */
#loaderGlobal {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(255,255,255,0.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.loader {
  border:6px solid #eee;
  border-top:6px solid #007bff;
  border-radius:50%;
  width:50px; height:50px;
  animation:spin 1s linear infinite;
}

@keyframes spin { 100%{ transform:rotate(360deg); } }

/* Alertas */
#alertaBox {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:10px 20px;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="panel"></div>

<div id="loaderGlobal"><div class="loader"></div></div>
<div id="alertaBox"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxsIZ7AvOFYbrpjHZlYaB6K1clx4cvND-VxvBFo7csmXwkIzCR7ppyrLt0dA-TAkoWVjQ/exec";

let map = L.map('map').setView([7.889,-72.49],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let reportesGlobales = [];
let rutaActual = null;
let capasReportes = [];
let capasRutas = [];
let alertasMostradas = new Set();

// Loader
function mostrarLoader(){ loaderGlobal.style.display="flex"; }
function ocultarLoader(){ loaderGlobal.style.display="none"; }

// UI
function renderInicio(){
panel.innerHTML = `
<button onclick="form()">📍 Reportar</button>
<button onclick="toggleCiclorutas()">🚴 Ciclorutas</button>
<button onclick="verMejorRuta()">🧠 Mejor ruta</button>
<button onclick="verTrafico()">🚦 Tráfico</button>
`;
}

// Formulario
function form(){
panel.innerHTML=`
<input id="nombre" placeholder="Nombre">
<select id="tipo">
<option value="accidente">Accidente</option>
<option value="obstruccion">Obstrucción</option>
</select>
<textarea id="desc"></textarea>
<button onclick="enviar()">Enviar</button>
`;
}

// Enviar
let ultimoEnvio=0;

function enviar(){
let ahora=Date.now();
if(ahora-ultimoEnvio<10000){
alert("Espera unos segundos");
return;
}

mostrarLoader();

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
nombre:nombre.value,
tipo:tipo.value,
descripcion:desc.value,
lat:7.88,lng:-72.49,
fecha:new Date()
})
})
.then(()=>{ alert("Enviado"); renderInicio(); })
.finally(ocultarLoader);

ultimoEnvio=ahora;
}

// Cargar reportes
function cargar(){
fetch(API_URL)
.then(r=>r.json())
.then(data=>{
reportesGlobales=data;

capasReportes.forEach(c=>map.removeLayer(c));
capasReportes=[];

data.forEach(rep=>{
let m=L.circleMarker([rep.lat,rep.lng]).addTo(map);
capasReportes.push(m);
});
});
}

// Tráfico
function verTrafico(){
let estado="🟢 Fluido";
panel.innerHTML=<b>${estado}</b>;
}

// Mejor ruta (simulado)
function verMejorRuta(){
let ruta={
puntos:[
{lat:7.88,lng:-72.49},
{lat:7.89,lng:-72.48}
]
};
rutaActual=ruta;
animarRuta(ruta);
}

// Animación
function animarRuta(ruta){
let line=L.polyline([],{color:"green"}).addTo(map);
let i=0;

function step(){
if(i>=ruta.puntos.length) return;
line.addLatLng([ruta.puntos[i].lat,ruta.puntos[i].lng]);
i++;
setTimeout(step,100);
}
step();
}

// Ciclorutas
function toggleCiclorutas(){
fetch("ciclorutas.json")
.then(r=>r.json())
.then(data=>{
data.forEach(r=>{
L.polyline(r.puntos.map(p=>[p.lat,p.lng]),{color:"blue"}).addTo(map);
});
});
}

// Alertas
function mostrarAlerta(txt){
alertaBox.innerText=txt;
alertaBox.style.display="block";
setTimeout(()=>alertaBox.style.display="none",3000);
}

// Voz
function hablar(txt){
if("speechSynthesis" in window){
let m=new SpeechSynthesisUtterance(txt);
speechSynthesis.speak(m);
}
}

// Revisar alertas
setInterval(()=>{
if(!rutaActual) return;

reportesGlobales.forEach(rep=>{
rutaActual.puntos.forEach(p=>{
let d=Math.hypot(p.lat-rep.lat,p.lng-rep.lng);
if(d<0.01){
let id=rep.fecha;
if(alertasMostradas.has(id)) return;
alertasMostradas.add(id);

mostrarAlerta("Precaución");
hablar("Precaución en la vía");
}
});
});
},5000);

// Init
renderInicio();
cargar();
</script>

</body>
</html>
