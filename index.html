<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movilidad Cúcuta</title>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
}

#map{
height:60vh;
width:100%;
border-bottom:4px solid #38bdf8;
}

.panel{
padding:15px;
background:#111827;
}

h2{
margin-bottom:15px;
color:#38bdf8;
font-size:30px;
}

select,
textarea{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
font-size:16px;
}

textarea{
height:100px;
resize:none;
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(90deg,#0ea5e9,#2563eb);
color:white;
box-shadow:0 0 15px rgba(14,165,233,0.5);
transition:0.3s;
}

button:hover{
transform:scale(1.02);
}

.loader{
display:none;
margin:auto;
margin-top:15px;
border:5px solid #1e293b;
border-top:5px solid #38bdf8;
border-radius:50%;
width:40px;
height:40px;
animation:girar 1s linear infinite;
}

@keyframes girar{
100%{
transform:rotate(360deg);
}
}

#estado{
margin-top:15px;
font-weight:bold;
text-align:center;
}

.filtros{
margin-top:20px;
padding:15px;
background:#1e293b;
border-radius:12px;
}

.filtros h3{
margin-bottom:10px;
}

label{
display:block;
margin-top:10px;
}

.menuFlotante{
position:absolute;
top:20px;
right:20px;
z-index:9999;
background:#1e293b;
width:50px;
height:50px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
box-shadow:0 0 15px rgba(0,0,0,0.5);
}

</style>

</head>

<body>

<div id="map"></div>

<div class="menuFlotante">
☰
</div>

<div class="panel">

<h2>🚴 Movilidad Cúcuta</h2>

<select id="tipo">

<option value="Accidente">
🚨 Accidente
</option>

<option value="Hueco">
🕳️ Hueco
</option>

<option value="Tráfico">
🚗 Tráfico
</option>

<option value="Cierre vía">
⛔ Cierre vía
</option>

<option value="Inseguridad">
⚠️ Inseguridad
</option>

</select>

<textarea
id="descripcion"
placeholder="Describe el reporte">
</textarea>

<button onclick="enviarReporte()">
📍 Reportar
</button>

<button onclick="seguirUbicacion()">
🧭 Seguir mi ubicación
</button>

<button onclick="toggleCiclorutas()">
🚴 Mostrar Ciclorutas
</button>

<div class="loader" id="loader"></div>

<div id="estado"></div>

<div class="filtros">

<h3>Filtros</h3>

<label>
<input type="checkbox"
checked
value="Accidente"
class="filtro">
Accidentes
</label>

<label>
<input type="checkbox"
checked
value="Hueco"
class="filtro">
Huecos
</label>

<label>
<input type="checkbox"
checked
value="Tráfico"
class="filtro">
Tráfico
</label>

<label>
<input type="checkbox"
checked
value="Cierre vía"
class="filtro">
Cierre vía
</label>

<label>
<input type="checkbox"
checked
value="Inseguridad"
class="filtro">
Inseguridad
</label>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxG-813M47w5pH2h-u62DeH00RfaYRVB9dYi9YLXAh-zYglPzmqEUfAo1tj41GcTVMJ/exec";

let map = L.map("map")
.setView([7.8891,-72.4967],13);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap"
}
).addTo(map);

let marcadores = [];
let capaCiclorutas = null;
let marcadorUsuario = null;
let siguiendo = false;

// =========================
// UBICACIÓN ACTUAL
// =========================

navigator.geolocation.getCurrentPosition(pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

map.setView([lat,lng],15);

marcadorUsuario = L.circleMarker(
[lat,lng],
{
radius:10,
fillColor:"#00bfff",
color:"#ffffff",
weight:3,
fillOpacity:1
}
).addTo(map);

});

// =========================
// SEGUIR UBICACIÓN
// =========================

function seguirUbicacion(){

siguiendo = !siguiendo;

if(siguiendo){

navigator.geolocation.watchPosition(pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

if(marcadorUsuario){

map.removeLayer(marcadorUsuario);

}

marcadorUsuario = L.circleMarker(
[lat,lng],
{
radius:10,
fillColor:"#00bfff",
color:"#ffffff",
weight:3,
fillOpacity:1
}
).addTo(map);

map.setView([lat,lng],16);

});

voz("Seguimiento activado");

}else{

voz("Seguimiento desactivado");

}

}

// =========================
// COLORES
// =========================

function colorTipo(tipo){

if(tipo==="Accidente") return "red";
if(tipo==="Hueco") return "orange";
if(tipo==="Tráfico") return "yellow";
if(tipo==="Cierre vía") return "black";
if(tipo==="Inseguridad") return "purple";

return "blue";

}

// =========================
// CARGAR REPORTES
// =========================

async function cargarReportes(){

marcadores.forEach(m=>{
map.removeLayer(m);
});

marcadores=[];

try{

const res = await fetch(API_URL);

const datos = await res.json();

const filtros =
[...document.querySelectorAll(".filtro:checked")]
.map(f=>f.value);

datos.forEach(r=>{

if(!filtros.includes(r.tipo)) return;

let marker = L.circleMarker(
[r.lat,r.lng],
{
radius:10,
fillColor:colorTipo(r.tipo),
color:"#fff",
weight:2,
fillOpacity:0.8
}
).addTo(map);

marker.bindPopup(`
<b>${r.tipo}</b><br>
${r.descripcion}<br><br>
🕒 ${r.fecha}
`);

marcadores.push(marker);

});

}catch(error){

console.log(error);

}

}

// =========================
// ENVIAR REPORTE
// =========================

async function enviarReporte(){

const estado =
document.getElementById("estado");

const loader =
document.getElementById("loader");

const tipo =
document.getElementById("tipo").value;

const descripcion =
document.getElementById("descripcion").value;

if(descripcion.length < 5){

estado.innerHTML =
"⚠️ Describe mejor el reporte";

return;

}

loader.style.display = "block";

estado.innerHTML = "";

navigator.geolocation.getCurrentPosition(async pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

const datos = {
tipo,
descripcion,
lat,
lng
};

try{

const res = await fetch(API_URL,{
method:"POST",
body:JSON.stringify(datos)
});

const txt = await res.text();

loader.style.display = "none";

estado.innerHTML = txt;

document.getElementById("descripcion").value="";

voz(txt);

cargarReportes();

}catch(error){

loader.style.display = "none";

estado.innerHTML =
"❌ Error enviando reporte";

}

});

}

// =========================
// VOZ
// =========================

function voz(texto){

const audio =
new SpeechSynthesisUtterance(texto);

audio.lang = "es-ES";

speechSynthesis.speak(audio);

}

// =========================
// CICLORUTAS
// =========================

async function toggleCiclorutas(){

if(capaCiclorutas){

map.removeLayer(capaCiclorutas);

capaCiclorutas = null;

voz("Ciclorutas ocultadas");

return;

}

try{

const response =
await fetch("ciclorutas.json");

const data =
await response.json();

capaCiclorutas =
L.geoJSON(data,{
style:{
color:"#00ffff",
weight:5,
opacity:0.9
}
}).addTo(map);

voz("Ciclorutas mostradas");

}catch(error){

alert("Error cargando ciclorutas");

}

}

// =========================
// FILTROS
// =========================

document
.querySelectorAll(".filtro")
.forEach(f=>{

f.addEventListener(
"change",
cargarReportes
);

});

// =========================
// SERVICE WORKER
// =========================

if("serviceWorker" in navigator){

navigator.serviceWorker
.register("sw.js");

}

// =========================

cargarReportes();

setInterval(cargarReportes,10000);

</script>

</body>
</html>
