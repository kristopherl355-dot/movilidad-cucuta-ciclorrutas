<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚴 Ciclorutas Cúcuta</title>

<link rel="manifest" href="manifest.json">

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
}

header{
background:linear-gradient(90deg,#0ea5e9,#2563eb);
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
color:white;
box-shadow:0 0 15px rgba(14,165,233,0.5);
}

#map{
height:55vh;
width:100%;
border-bottom:4px solid #38bdf8;
}

.panel{
padding:15px;
}

.card{
background:#1e293b;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 0 10px rgba(0,0,0,0.3);
}

select,
textarea{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
background:#334155;
color:white;
font-size:16px;
}

textarea{
resize:none;
height:90px;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(90deg,#38bdf8,#0ea5e9);
color:white;
transition:0.3s;
box-shadow:0 0 15px rgba(56,189,248,0.4);
}

button:hover{
transform:scale(1.02);
}

#estado{
margin-top:12px;
text-align:center;
font-weight:bold;
}

.loader{
display:none;
margin:auto;
margin-top:15px;
border:5px solid #1e293b;
border-top:5px solid #38bdf8;
border-radius:50%;
width:45px;
height:45px;
animation:girar 1s linear infinite;
}

@keyframes girar{
100%{
transform:rotate(360deg);
}
}
 .glowRuta{
filter:drop-shadow(0 0 6px rgba(255,255,255,0.7));
}
</style>

</head>

<body>

<header>
🚴 Ciclorutas Cúcuta
</header>

<div id="map"></div>

<div class="panel">

<div class="card">

<select id="tipo">

<option value="">
📌 Selecciona un reporte
</option>

<option value="🚧 Hueco">
🚧 Hueco
</option>

<option value="🚗 Tráfico">
🚗 Tráfico
</option>

<option value="🚨 Accidente">
🚨 Accidente
</option>

<option value="⚠️ Inseguridad">
⚠️ Inseguridad
</option>

<option value="⛔ Cierre vía">
⛔ Cierre vía
</option>

</select>

<textarea
id="descripcion"
placeholder="Describe el problema..."
></textarea>

<button onclick="enviarReporte()">
📍 Reportar
</button>

<button onclick="seguirUbicacion()">
🧭 Seguir ubicación
</button>

<button onclick="mostrarCiclorutas()">
🚴 Mostrar ciclorutas
</button>

<button onclick="cargarReportes()">
📌 Mostrar reportes
</button>

<div class="loader" id="loader"></div>

<div id="estado"></div>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxbv0wvs5BbOX48_iMqxJzKexWKJ7-kJ-wY4QsY4qE22L7pxRIx_GhokvSqmK15UxJA/exec";

let map = L.map("map").setView(
[7.8891,-72.4967],
13
);

setTimeout(()=>{
map.invalidateSize();
},500);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap"
}
).addTo(map);

let marcadorUsuario = null;
let watchID = null;
let reportes = [];
let capaCiclorutas = null;

// =======================
// ICONOS
// =======================

const iconoUsuario = L.icon({
iconUrl:
"https://cdn-icons-png.flaticon.com/512/149/149060.png",
iconSize:[38,38]
});

const iconoReporte = L.icon({
iconUrl:
"https://cdn-icons-png.flaticon.com/512/684/684908.png",
iconSize:[35,35]
});

// =======================
// VOZ
// =======================

function hablar(texto){

const voz =
new SpeechSynthesisUtterance(texto);

voz.lang = "es-ES";

speechSynthesis.speak(voz);

}

// =======================
// UBICACIÓN
// =======================

navigator.geolocation.getCurrentPosition(pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

map.setView([lat,lng],15);

marcadorUsuario =
L.marker(
[lat,lng],
{
icon:iconoUsuario
}
)
.addTo(map)
.bindPopup("📍 Tu ubicación");

});

function seguirUbicacion(){

if(watchID){

navigator.geolocation.clearWatch(watchID);

watchID = null;

document.getElementById("estado")
.innerHTML =
"🛑 Seguimiento detenido";

hablar("Seguimiento detenido");

return;

}

watchID =
navigator.geolocation.watchPosition(pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

if(marcadorUsuario){

marcadorUsuario.setLatLng([lat,lng]);

}else{

marcadorUsuario =
L.marker(
[lat,lng],
{
icon:iconoUsuario
}
)
.addTo(map);

}

map.setView([lat,lng],16);

});

document.getElementById("estado")
.innerHTML =
"🟢 Seguimiento activado";

hablar("Seguimiento activado");

}

// =======================
// REPORTAR
// =======================

async function enviarReporte(){

const tipo =
document.getElementById("tipo").value;

const descripcion =
document.getElementById("descripcion").value;

const estado =
document.getElementById("estado");

const loader =
document.getElementById("loader");

if(!tipo || descripcion.length < 5){

estado.innerHTML =
"⚠️ Describe mejor el reporte";

hablar("Describe mejor el reporte");

return;

}

loader.style.display = "block";

navigator.geolocation.getCurrentPosition(async pos=>{

const datos = {

tipo,
descripcion,
lat:pos.coords.latitude,
lng:pos.coords.longitude

};

try{

const res =
await fetch(
API_URL,
{
method:"POST",
body:JSON.stringify(datos)
}
);

const txt =
await res.text();

estado.innerHTML = txt;

hablar(txt);

document.getElementById(
"descripcion"
).value = "";

cargarReportes();

}catch(error){

estado.innerHTML =
"❌ Error enviando reporte";

hablar("Error enviando reporte");

}

loader.style.display = "none";

});

}

// =======================
// CARGAR REPORTES
// =======================

async function cargarReportes(){

try{

reportes.forEach(r=>{
map.removeLayer(r);
});

reportes = [];

const res =
await fetch(
API_URL + "?t=" + Date.now()
);

const datos =
await res.json();

datos.forEach(r=>{

if(!r.lat || !r.lng) return;

const marker =
L.marker(
[
Number(r.lat),
Number(r.lng)
],
{
icon:iconoReporte
}
)
.addTo(map);

marker.bindPopup(`
<b>${r.tipo}</b>
<br><br>
${r.descripcion}
<br><br>
🕒 ${r.fecha}
<br><br>

<button onclick="validarReporte(
${r.id},
${r.lat},
${r.lng}
)">
✅ Ya no está
</button>
`);

reportes.push(marker);

});

document.getElementById("estado")
.innerHTML =
"✅ Reportes cargados";

}catch(error){

document.getElementById("estado")
.innerHTML =
"❌ Error cargando reportes";

console.error(error);

}

}

// =======================
// VALIDAR REPORTE
// =======================

async function validarReporte(id,lat,lng){

navigator.geolocation.getCurrentPosition(
async pos=>{

const miLat = pos.coords.latitude;
const miLng = pos.coords.longitude;

const distancia = Math.sqrt(

Math.pow(miLat-lat,2)+
Math.pow(miLng-lng,2)

);

if(distancia > 0.002){

alert(
"⚠️ Debes estar cerca del reporte"
);

return;

}

const confirmar =
confirm(
"¿Confirmas que el problema ya no existe?"
);

if(!confirmar) return;

try{

const res = await fetch(
API_URL,
{
method:"POST",
body:JSON.stringify({
eliminar:true,
id:id
})
}
);

const txt = await res.text();

alert(txt);

hablar(txt);

cargarReportes();

}catch(error){

alert(
"❌ Error eliminando reporte"
);

console.error(error);

}

}
);

}

// =======================
// CICLORUTAS
// =======================

async function mostrarCiclorutas(){

if(capaCiclorutas){

map.removeLayer(capaCiclorutas);

capaCiclorutas = null;

document.getElementById("estado")
.innerHTML =
"🚴 Ciclorutas ocultadas";

return;

}

try{

const res =
await fetch(
"ciclorutas.json?t=" + Date.now()
);

const rutas =
await res.json();

capaCiclorutas =
L.layerGroup();

rutas.forEach(ruta=>{

const linea =
L.polyline(
ruta.coordenadas,
{
color:ruta.color,
weight:8,
opacity:0.95,
lineCap:"round",
lineJoin:"round",
dashArray:"10,6"
}
);

linea.bindPopup(
"🚴 " + ruta.nombre
);

linea.bindTooltip(
"🚴 " + ruta.nombre,
{
permanent:false,
direction:"top"
}
);

linea.setStyle({
className:"glowRuta"
});

capaCiclorutas.addLayer(linea);

});

capaCiclorutas.addTo(map);

document.getElementById("estado")
.innerHTML =
"🚴 Ciclorutas cargadas";

hablar("Ciclorutas cargadas");

}catch(error){

document.getElementById("estado")
.innerHTML =
"❌ Error cargando ciclorutas";

console.error(error);

}

}

// =======================
// GUARDAR UBICACIÓN
// =======================

window.addEventListener(
"beforeunload",
()=>{

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(
async pos=>{

try{

await fetch(
API_URL,
{
method:"POST",
body:JSON.stringify({
tipo:"📍 Seguimiento",
descripcion:"Última ubicación guardada",
lat:pos.coords.latitude,
lng:pos.coords.longitude
})
}
);

}catch(e){}

}
);

}

}
);

// =======================

cargarReportes();

setInterval(
cargarReportes,
10000
);

</script>

</body>
</html>
