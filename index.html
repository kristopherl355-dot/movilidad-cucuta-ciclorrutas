<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movilidad Cúcuta</title>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
}

#map{
height:60vh;
width:100%;
border-bottom:4px solid #38bdf8;
}

.panel{
padding:15px;
background:#0f172a;
}

h2{
margin-bottom:10px;
color:#38bdf8;
font-size:30px;
text-shadow:0 0 15px #38bdf8;
}

select,
textarea{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
font-size:15px;
outline:none;
}

textarea{
height:90px;
resize:none;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(90deg,#38bdf8,#2563eb);
color:white;
transition:0.3s;
box-shadow:0 0 20px rgba(56,189,248,0.6);
}

button:hover{
transform:scale(1.02);
}

.loader{
display:none;
margin:auto;
margin-top:15px;
border:5px solid #1e293b;
border-top:5px solid #38bdf8;
border-radius:50%;
width:45px;
height:45px;
animation:girar 1s linear infinite;
}

@keyframes girar{
100%{
transform:rotate(360deg);
}
}

#estado{
margin-top:10px;
text-align:center;
font-weight:bold;
font-size:15px;
}

.filtros{
margin-top:15px;
background:#1e293b;
padding:15px;
border-radius:12px;
}

.filtros h3{
margin-bottom:10px;
color:#38bdf8;
}

label{
display:block;
margin-top:8px;
}

</style>

</head>

<body>

<div id="map"></div>

<div class="panel">

<h2>🚲 Movilidad Cúcuta</h2>

<select id="tipo">

<option value="Accidente">🚨 Accidente</option>
<option value="Hueco">🕳️ Hueco</option>
<option value="Tráfico">🚗 Tráfico</option>
<option value="Cierre vía">⛔ Cierre vía</option>
<option value="Inseguridad">⚠️ Inseguridad</option>

</select>

<textarea
id="descripcion"
placeholder="Describe el reporte"></textarea>

<button onclick="enviarReporte()">
📍 Reportar
</button>

<button onclick="seguirUbicacion()">
🧭 Seguir mi ubicación
</button>

<button onclick="toggleCiclorutas()">
🚴 Mostrar Ciclorutas
</button>

<div class="loader" id="loader"></div>

<div id="estado"></div>

<div class="filtros">

<h3>Filtros</h3>

<label>
<input type="checkbox" checked value="Accidente" class="filtro">
Accidentes
</label>

<label>
<input type="checkbox" checked value="Hueco" class="filtro">
Huecos
</label>

<label>
<input type="checkbox" checked value="Tráfico" class="filtro">
Tráfico
</label>

<label>
<input type="checkbox" checked value="Cierre vía" class="filtro">
Cierre vía
</label>

<label>
<input type="checkbox" checked value="Inseguridad" class="filtro">
Inseguridad
</label>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzTxFSbaH3xR3Qr7GsNhn1hENm0TufCklEJpp5lf9HTvCBNqlkLoAXcw0_nEGCFQJ76/exec";

let map = L.map("map")
.setView([7.8891,-72.4967],13);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap"
}
).addTo(map);

let marcadores = [];
let capaCiclorutas = null;
let marcadorUsuario = null;

navigator.geolocation.getCurrentPosition(pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

map.setView([lat,lng],15);

marcadorUsuario = L.circleMarker(
[lat,lng],
{
radius:10,
fillColor:"#00ffff",
color:"#ffffff",
weight:3,
fillOpacity:1
}
)
.addTo(map)
.bindPopup("📍 Tú estás aquí");

});

function colorTipo(tipo){

if(tipo==="Accidente") return "red";

if(tipo==="Hueco") return "orange";

if(tipo==="Tráfico") return "yellow";

if(tipo==="Cierre vía") return "black";

if(tipo==="Inseguridad") return "purple";

return "blue";

}

async function cargarReportes(){

const loader =
document.getElementById("loader");

loader.style.display="block";

marcadores.forEach(m=>{

map.removeLayer(m);

});

marcadores=[];

try{

const res =
await fetch(API_URL + "?t=" + Date.now());

const datos = await res.json();

const filtrosActivos =
[...document.querySelectorAll(".filtro:checked")]
.map(f=>f.value);

datos.forEach(r=>{

if(!filtrosActivos.includes(r.tipo)) return;

let marker = L.circleMarker(
[r.lat,r.lng],
{
radius:10,
fillColor:colorTipo(r.tipo),
color:"#ffffff",
weight:2,
fillOpacity:0.8
}
).addTo(map);

marker.bindPopup(`
<b>${r.tipo}</b>
<br><br>
${r.descripcion}
<br><br>
🕒 ${r.fecha}
`);

marcadores.push(marker);

});

loader.style.display="none";

}catch(error){

loader.style.display="none";

document.getElementById("estado").innerHTML =
"❌ Error cargando reportes";

console.log(error);

}

}

document.querySelectorAll(".filtro")
.forEach(f=>{

f.addEventListener(
"change",
cargarReportes
);

});

async function enviarReporte(){

const estado =
document.getElementById("estado");

const loader =
document.getElementById("loader");

const tipo =
document.getElementById("tipo").value;

const descripcion =
document.getElementById("descripcion").value;

if(descripcion.length < 5){

estado.innerHTML =
"⚠️ Describe mejor el reporte";

return;

}

loader.style.display="block";

estado.innerHTML="";

navigator.geolocation.getCurrentPosition(async pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

const datos = {
tipo,
descripcion,
lat,
lng
};

try{

const res = await fetch(
API_URL + "?t=" + Date.now(),
{
method:"POST",
body:JSON.stringify(datos)
});

const txt = await res.text();

loader.style.display="none";

estado.innerHTML = txt;

document.getElementById("descripcion").value="";

voz(txt);

cargarReportes();

}catch(error){

loader.style.display="none";

estado.innerHTML =
"❌ Error enviando reporte";

console.log(error);

}

});

}

function voz(texto){

const audio =
new SpeechSynthesisUtterance(texto);

audio.lang="es-ES";

speechSynthesis.speak(audio);

}

function seguirUbicacion(){

navigator.geolocation.watchPosition(pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

map.setView([lat,lng],16);

if(marcadorUsuario){

marcadorUsuario.setLatLng([lat,lng]);

}else{

marcadorUsuario =
L.circleMarker(
[lat,lng],
{
radius:10,
fillColor:"#00ffff",
color:"#ffffff",
weight:3,
fillOpacity:1
}
)
.addTo(map)
.bindPopup("📍 Tú estás aquí");

}

});

}

async function toggleCiclorutas(){

if(capaCiclorutas){

map.removeLayer(capaCiclorutas);

capaCiclorutas = null;

return;

}

try{

const res =
await fetch("ciclorutas.json?t=" + Date.now());

const data =
await res.json();

capaCiclorutas =
L.geoJSON(data,{
style:{
color:"#00ffff",
weight:5
}
}).addTo(map);

}catch(error){

document.getElementById("estado").innerHTML =
"❌ Error cargando ciclorutas";

console.log(error);

}

}

if("serviceWorker" in navigator){

navigator.serviceWorker.register("sw.js");

}

cargarReportes();

setInterval(cargarReportes,5000);

</script>

</body>
</html>
